name: CI — ResearchOS Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: researchos-backend

    steps:
      # 1. Check out code
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # 2. Install Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: researchos-backend/requirements.txt

      # 3. Install dependencies
      #    Using --upgrade pip first to avoid resolver issues on fresh runners
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Verify pytest is reachable before running
      #    (catches PATH issues without a cryptic exit 127)
      - name: Verify pytest installation
        run: python -m pytest --version

      # 5. Run the test suite
      #    - `python -m pytest` is always correct: it uses the exact Python
      #      that installed pytest, regardless of PATH
      #    - Dummy env vars prevent import-time crashes from missing .env
      #    - Actual API calls must be mocked in the tests themselves
      - name: Run tests
        env:
          GROQ_API_KEYS: "dummy_key_for_ci"
          TAVILY_API_KEYS: "dummy_key_for_ci"
          GOOGLE_API_KEY: "dummy_key_for_ci"
          COHERE_API_KEY: "dummy_key_for_ci"
          LANGCHAIN_TRACING_V2: "false"
          SECRET_KEY: "ci_secret_key_not_real"
        run: python -m pytest tests/ -v --tb=short