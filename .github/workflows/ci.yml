name: CI — ResearchOS Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: researchos-backend

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # 2. Install Python 3.12 (same version you use locally)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: researchos-backend/requirements.txt

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the test suite
      # Dummy env vars are needed so imports don't crash looking for .env
      # The actual API calls are all mocked — these values are never used
      - name: Run tests
        env:
          GROQ_API_KEYS: "dummy_key_for_ci"
          TAVILY_API_KEYS: "dummy_key_for_ci"
          GOOGLE_API_KEY: "dummy_key_for_ci"
          COHERE_API_KEY: "dummy_key_for_ci"
          LANGCHAIN_TRACING_V2: "false"
          SECRET_KEY: "ci_secret_key_not_real"
        run: python -m pytest tests/ -v --tb=short